apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app2
  namespace: sample-app2
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: sample-app2
  template:
    metadata:
      labels:
        app: sample-app2
    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          command:
            - /bin/sh
            - -c

          args:
            - |
              mkdir -p /usr/share/nginx/html/app2

              cat <<'EOF' > /usr/share/nginx/html/app2/index.html
              <!DOCTYPE html>
              <html>
              <head>
                <title>Application 2</title>
              </head>
              <body style="
                background:#1565c0;
                color:white;
                font-family:Arial;
                text-align:center;
                padding-top:100px;
              ">
                <h1>APPLICATION 2</h1>
                <h2>SPA fallback works</h2>
                <p>Current URL:</p>

                <h3 id="path"></h3>

                <script>
                  document.getElementById("path").innerText =
                    window.location.pathname;
                </script>
              </body>
              </html>
              EOF

              cat <<'EOF' > /etc/nginx/conf.d/default.conf
              server {
                  listen 80;
                  server_name _;

                  root /usr/share/nginx/html;

                  location /app2/ {
                      try_files $uri $uri/ /app2/index.html;
                  }
              }
              EOF

              nginx -g 'daemon off;'