apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app2
  namespace: sample-app2
spec:
  replicas: 2

  selector:
    matchLabels:
      app: sample-app2

  template:
    metadata:
      labels:
        app: sample-app2

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          command:
            - /bin/sh
            - -c

          args:
            - |
              cat <<'EOF' > /usr/share/nginx/html/index.html
              <!DOCTYPE html>
              <html>
              <head>
                <title>Sample App 1</title>
                <style>
                  body {
                    background: #1565c0;
                    color: white;
                    font-family: Arial, sans-serif;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 100vh;
                    margin: 0;
                  }

                  .box {
                    text-align: center;
                  }

                  h1 {
                    font-size: 64px;
                  }

                  p {
                    font-size: 24px;
                  }
                </style>
              </head>

              <body>
                <div class="box">
                  <h1>APPLICATION 1</h1>
                  <p>Served through Kubernetes Gateway API</p>
                  <p>Hostname: app2.example.local</p>
                </div>
              </body>
              </html>
              EOF

              nginx -g 'daemon off;'