apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addons-extra-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gareji/argocd.git
    targetRevision: main
    path: addons/extra-manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true